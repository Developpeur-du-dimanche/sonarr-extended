name: "API Docs"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - v5-develop
    paths:
      - ".github/workflows/api_docs.yml"
      - "docs.sh"
      - "src/Sonarr.Api.*/**"
      - "src/Sonarr.Http/**"
      - "src/**/*.csproj"
      - "src/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api_docs:
    runs-on: ubuntu-latest
    if: github.repository == 'Developpeur-du-dimanche/sonarr-extended'
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.OPENAPI_PAT || github.token }}
      BASE_BRANCH: v5-develop
    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        id: setup-dotnet

      - name: Create openapi.json
        run: ./scripts/docs.sh Linux x64

      - name: Commit API Docs Change
        continue-on-error: true
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git checkout -b api-docs
          git add src
          if git status | grep -q modified
          then
            git commit -am 'Automated API Docs update' -m "ignore-downstream"
            git push -f --set-upstream origin api-docs
            if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head api-docs --base "$BASE_BRANCH" --state open --json number --jq 'length')" = "0" ]
            then
              gh pr create --repo "$GITHUB_REPOSITORY" --head api-docs --base "$BASE_BRANCH" --title "Update API docs" --body "Automated update of the OpenAPI specification (\`openapi.json\`) to reflect the latest API changes on \`$BASE_BRANCH\`. Generated by the API Docs workflow."
            fi
          else
            echo "No changes since last run"
          fi

      - name: Notify
        if: failure()
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "GitHub Actions"
          avatar-url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          embed-title: "${{ github.workflow }}: Failure"
          embed-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          embed-description: |
            Failed to update API docs
          embed-color: "15158332"
