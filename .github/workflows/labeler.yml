name: "Pull Request Labeler"
on:
  - pull_request_target

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.repository == 'Developpeur-du-dimanche/sonarr-extended'
    steps:
      - uses: actions/labeler@v6
